name: Build DroidFish APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v3
      - name: Install SDK / NDK
        run: sdkmanager "platforms;android-28" "build-tools;30.0.3" "ndk;21.4.7075529"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: droidfish-debug-apk
          path: DroidFishApp/build/outputs/apk/debug/*.apk
